# iPhoneでのスワイプ操作をtmuxのスクロール・選択として機能させる
set -g mouse on

# 既定の1ノッチ=5行だと指の移動量に対して飛びすぎるため1行単位に合わせる
# (client/src/components/terminalTouchScroll.tsが移動量に比例したホイール数を送る前提)
bind -T copy-mode    WheelUpPane   send-keys -X scroll-up
bind -T copy-mode    WheelDownPane send-keys -X scroll-down
bind -T copy-mode-vi WheelUpPane   send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# タップで最新表示へ復帰させる(モード状態はtmux側が持つためクライアントでの追跡が不要になる)
bind -T copy-mode    MouseDown1Pane send-keys -X cancel
bind -T copy-mode-vi MouseDown1Pane send-keys -X cancel
